name: Backend WebRTC Tests

on:
  workflow_dispatch:
  push:
    branches:
      - feature/member3-webrtc-backend
  pull_request:
    branches:
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/backend-webrtc-tests.yml"

jobs:
  backend-webrtc-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Tests use mocked persistence; these values only allow SQLAlchemy to build its engine.
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: vision_assistant
      DB_USER: test
      DB_PASSWORD: test
      JWT_SECRET_KEY: test-only-secret-key-for-ci
      JWT_ALGORITHM: HS256

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi sqlalchemy pymysql python-dotenv PyJWT pydantic pytest aiortc opencv-python-headless numpy

      - name: Run WebRTC and session lifecycle tests
        run: |
          python -m pytest tests/test_sessions.py tests/test_webrtc_protocol.py tests/test_webrtc_media.py -q
