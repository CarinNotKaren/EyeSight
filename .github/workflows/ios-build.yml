
name: EyeSight iOS Build


on:
  workflow_dispatch:
  push:
    branches:
      - maria-webrtc

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate native iOS project
        working-directory: mobile
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: pod install

      - name: Build unsigned iOS app
        working-directory: mobile
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)

          if [ -z "$WORKSPACE" ]; then
            echo "Xcode workspace not found"
            exit 1
          fi

          SCHEME=$(basename "$WORKSPACE" .xcworkspace)

          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/EyeSight.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        working-directory: mobile
        run: |
          APP_PATH=$(find build/EyeSight.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "iOS application not found"
            exit 1
          fi

          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/

          cd build/ipa
          zip -qry EyeSight-unsigned.ipa Payload

      - name: Upload EyeSight IPA
        uses: actions/upload-artifact@v4
        with:
          name: EyeSight-iOS-unsigned
          path: mobile/build/ipa/EyeSight-unsigned.ipa
          if-no-files-found: error

